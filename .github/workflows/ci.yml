name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        # 宿主依赖链（@deepseek-ai/dsh 传递引入 koffi / node-pty / protobufjs）
        # 带构建脚本，测试不需要任何构建产物；pnpm 12 默认 strict 会直接报错。
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
